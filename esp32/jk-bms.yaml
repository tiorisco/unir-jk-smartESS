esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret bms_mac
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 10s
    id: bms0

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "carga activada"
    discharging:
      name: "descarga activada"
    online_status:
      name: "online"

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    state_of_charge:
      name: "soc"
    total_voltage:
      name: "voltaje"
    current:
      name: "corriente"
    power:
      name: "potencia"
    capacity_remaining:
      name: "capacidad restante"
    temperature_sensor_1:
      name: "temp1"
    temperature_sensor_2:
      name: "temp2"
    mosfet_temperature:
      name: "temp mosfet"
    min_cell_voltage:
      name: "celda min"
    max_cell_voltage:
      name: "celda max"
    delta_cell_voltage:
      name: "celda delta"
    # 16 celdas en serie (53,4 V / 3,34 V por celda).
    cell_voltage_1: {name: "celda 1"}
    cell_voltage_2: {name: "celda 2"}
    cell_voltage_3: {name: "celda 3"}
    cell_voltage_4: {name: "celda 4"}
    cell_voltage_5: {name: "celda 5"}
    cell_voltage_6: {name: "celda 6"}
    cell_voltage_7: {name: "celda 7"}
    cell_voltage_8: {name: "celda 8"}
    cell_voltage_9: {name: "celda 9"}
    cell_voltage_10: {name: "celda 10"}
    cell_voltage_11: {name: "celda 11"}
    cell_voltage_12: {name: "celda 12"}
    cell_voltage_13: {name: "celda 13"}
    cell_voltage_14: {name: "celda 14"}
    cell_voltage_15: {name: "celda 15"}
    cell_voltage_16: {name: "celda 16"}

  # Diagnostico del puente (solar/bateria/sensor/<nombre>/state)
  - platform: wifi_signal
    name: "wifi dbm"
    update_interval: 60s
  - platform: uptime
    name: "tiempo encendido"
    update_interval: 60s
  - platform: ble_client
    ble_client_id: client0
    type: rssi
    name: "bms rssi"
    update_interval: 60s

text_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    errors:
      name: "errores"
    software_version:
      name: "version software"
    hardware_version:
      name: "version hardware"
