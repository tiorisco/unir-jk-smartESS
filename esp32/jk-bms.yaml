# Paso 2: ESP32 como puente BMS JK (BLE) -> wifi -> broker MQTT en la nube.
# SOLO LECTURA: no se declara ningun switch, asi que nunca se escribe en el BMS.
# Los secretos estan en secrets.yaml (ignorado por git).

substitutions:
  name: jk-bms
  # Si el SOC o el voltaje salen absurdos, prueba JK02_24S.
  # Sin confirmar cual usa el JK-B2A20S20P (ver el capitulo 1 del tutorial).
  protocol_version: JK02_32S

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 1d

logger:

# Actualizacion por wifi: despues de la primera grabacion por USB se puede
# grabar desde el PC sin tocar el ESP32 (esphome upload jk-bms.yaml --device <IP>)
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Los datos de cada sensor salen en: solar/bateria/sensor/<nombre>/state
# Estado del dispositivo (online/offline) en: solar/bateria/status
mqtt:
  broker: !secret mqtt_broker
  port: 8883
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: solar/bateria
  discovery: false
  # En ESP-IDF, sin certificate_authority ESPHome NO usa TLS (habla en texto
  # plano y el broker corta). Raiz: DigiCert Global Root G2, verificada contra
  # el broker real (valida por TLS 1.3).
